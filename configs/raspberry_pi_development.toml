[application]
log_level = "INFO"

[camera]
enabled = true
required = false
source = "camera"
device = 0
width = 640
height = 480
capture_fps = 20
reconnect_delay_seconds = 2.0
max_reconnect_delay_seconds = 30.0
preview = true

[perception]
inference_fps = 3
confidence_threshold = 0.40

[diagnostics]
metrics_enabled = true

[output]
jsonl_enabled = true
log_seen_objects = false

[memory]
enabled = true

[speech]
enabled = true
engine = "espeak"
speak_query_answers = true

[speech_input]
enabled = true
engine = "vosk"
